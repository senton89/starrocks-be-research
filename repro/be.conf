# Конфигурация StarRocks BE для тестового запуска.
# Источник: отчёт, раздел 7.1.1 / Приложение A.
# Ожидаемый результат запуска с этой конфигурацией на сборке
# без StarCache — SIGSEGV до инициализации логирования (см. REPORT.md, раздел 7).

storage_root_path = /tmp/starrocks_test/data
spill_local_storage_dir = /tmp/starrocks_test/spill
port = 19080
enable_spill = true
datacache_enable = false
meta_dir = /tmp/starrocks_test/meta
sys_log_level = INFO
priority_networks = 127.0.0.1
default_locale = en_US.UTF-8
